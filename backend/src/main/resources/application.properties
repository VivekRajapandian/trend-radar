spring.application.name=trend-radar-backend
server.port=8080
spring.config.import=optional:file:.env[.properties]

trendradar.ebay.enabled=${TREND_RADAR_EBAY_ENABLED:false}
trendradar.ebay.token-url=${TREND_RADAR_EBAY_TOKEN_URL:https://api.sandbox.ebay.com/identity/v1/oauth2/token}
trendradar.ebay.search-url=${TREND_RADAR_EBAY_SEARCH_URL:https://api.ebay.com/buy/browse/v1/item_summary/search}
trendradar.ebay.username=${TREND_RADAR_EBAY_USERNAME:}
trendradar.ebay.password=${TREND_RADAR_EBAY_PASSWORD:}
trendradar.ebay.scope=${TREND_RADAR_EBAY_SCOPE:https://api.ebay.com/oauth/api_scope}
trendradar.ebay.limit=${TREND_RADAR_EBAY_LIMIT:10}
trendradar.ebay.marketplace-id=${TREND_RADAR_EBAY_MARKETPLACE_ID:EBAY_CA}
