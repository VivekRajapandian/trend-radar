databaseChangeLog:
  - changeSet:
      id: 001-create-provider-run
      author: trendradar
      changes:
        - createTable:
            tableName: provider_run
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: source_type
                  type: VARCHAR(80)
                  constraints:
                    nullable: false
              - column:
                  name: query
                  type: VARCHAR(500)
                  constraints:
                    nullable: false
              - column:
                  name: niche_code
                  type: VARCHAR(120)
                  constraints:
                    nullable: false
              - column:
                  name: region
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(40)
                  constraints:
                    nullable: false
              - column:
                  name: started_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: completed_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: records_fetched
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: error_message
                  type: TEXT

  - changeSet:
      id: 002-create-source-record
      author: trendradar
      changes:
        - createTable:
            tableName: source_record
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: provider_run_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: source_type
                  type: VARCHAR(80)
                  constraints:
                    nullable: false
              - column:
                  name: external_id
                  type: VARCHAR(255)
              - column:
                  name: title
                  type: VARCHAR(1000)
              - column:
                  name: raw_json
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: fetched_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: source_record
            baseColumnNames: provider_run_id
            constraintName: fk_source_record_provider_run
            referencedTableName: provider_run
            referencedColumnNames: id

  - changeSet:
      id: 003-create-normalized-signal
      author: trendradar
      changes:
        - createTable:
            tableName: normalized_signal
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: provider_run_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: source_record_id
                  type: BIGINT
              - column:
                  name: product_concept_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: product_name
                  type: VARCHAR(500)
                  constraints:
                    nullable: false
              - column:
                  name: category_name
                  type: VARCHAR(255)
              - column:
                  name: niche_code
                  type: VARCHAR(120)
                  constraints:
                    nullable: false
              - column:
                  name: region
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: price
                  type: NUMERIC(12,2)
              - column:
                  name: currency
                  type: VARCHAR(10)
              - column:
                  name: seller_feedback_percentage
                  type: VARCHAR(20)
              - column:
                  name: seller_feedback_score
                  type: INT
              - column:
                  name: item_location_country
                  type: VARCHAR(20)
              - column:
                  name: shipping_cost
                  type: NUMERIC(12,2)
              - column:
                  name: shipping_cost_type
                  type: VARCHAR(80)
              - column:
                  name: condition
                  type: VARCHAR(120)
              - column:
                  name: buying_options
                  type: VARCHAR(500)
              - column:
                  name: normalized_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: normalized_signal
            baseColumnNames: provider_run_id
            constraintName: fk_normalized_signal_provider_run
            referencedTableName: provider_run
            referencedColumnNames: id
        - addForeignKeyConstraint:
            baseTableName: normalized_signal
            baseColumnNames: source_record_id
            constraintName: fk_normalized_signal_source_record
            referencedTableName: source_record
            referencedColumnNames: id

  - changeSet:
      id: 004-create-scoring-run
      author: trendradar
      changes:
        - createTable:
            tableName: scoring_run
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: provider_run_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: scoring_version
                  type: VARCHAR(60)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(40)
                  constraints:
                    nullable: false
              - column:
                  name: started_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: completed_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: opportunities_scored
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: error_message
                  type: TEXT
        - addForeignKeyConstraint:
            baseTableName: scoring_run
            baseColumnNames: provider_run_id
            constraintName: fk_scoring_run_provider_run
            referencedTableName: provider_run
            referencedColumnNames: id

  - changeSet:
      id: 005-create-opportunity-snapshot
      author: trendradar
      changes:
        - createTable:
            tableName: opportunity_snapshot
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: scoring_run_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: provider_run_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: product_concept_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: product_name
                  type: VARCHAR(500)
                  constraints:
                    nullable: false
              - column:
                  name: category_name
                  type: VARCHAR(255)
              - column:
                  name: niche_code
                  type: VARCHAR(120)
                  constraints:
                    nullable: false
              - column:
                  name: niche_display_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: region_code
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: region_display_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: score
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: score_label
                  type: VARCHAR(40)
                  constraints:
                    nullable: false
              - column:
                  name: marketplace_proof_score
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: price_viability_score
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: freshness_score
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: seller_quality_score
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: shipping_risk_score
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: competition_risk_score
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: final_score
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: estimated_sold_count
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: active_listings
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: median_price
                  type: NUMERIC(12,2)
              - column:
                  name: min_price
                  type: NUMERIC(12,2)
              - column:
                  name: max_price
                  type: NUMERIC(12,2)
              - column:
                  name: demand_signal
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: source_evidence_json
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: risks_json
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: explanation
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: generated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: opportunity_snapshot
            baseColumnNames: scoring_run_id
            constraintName: fk_opportunity_snapshot_scoring_run
            referencedTableName: scoring_run
            referencedColumnNames: id
        - addForeignKeyConstraint:
            baseTableName: opportunity_snapshot
            baseColumnNames: provider_run_id
            constraintName: fk_opportunity_snapshot_provider_run
            referencedTableName: provider_run
            referencedColumnNames: id
        - createIndex:
            tableName: opportunity_snapshot
            indexName: idx_opportunity_snapshot_lookup
            columns:
              - column:
                  name: niche_code
              - column:
                  name: region_code
              - column:
                  name: generated_at

  - changeSet:
      id: 006-add-audit-timestamps
      author: trendradar
      changes:
        - addColumn:
            tableName: provider_run
            columns:
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addColumn:
            tableName: source_record
            columns:
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addColumn:
            tableName: normalized_signal
            columns:
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addColumn:
            tableName: scoring_run
            columns:
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addColumn:
            tableName: opportunity_snapshot
            columns:
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

  - changeSet:
      id: 007-add-observability-indexes
      author: trendradar
      changes:
        - createIndex:
            tableName: provider_run
            indexName: idx_provider_run_started_at
            columns:
              - column:
                  name: started_at
        - createIndex:
            tableName: provider_run
            indexName: idx_provider_run_status_started_at
            columns:
              - column:
                  name: status
              - column:
                  name: started_at
        - createIndex:
            tableName: scoring_run
            indexName: idx_scoring_run_started_at
            columns:
              - column:
                  name: started_at
        - createIndex:
            tableName: source_record
            indexName: idx_source_record_provider_run
            columns:
              - column:
                  name: provider_run_id
